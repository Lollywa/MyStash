<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="MyStash – deine persönliche Sammlung praktischer Features." />
    <meta name="application-name" content="MyStash" />
    <meta name="apple-mobile-web-app-title" content="MyStash" />
    <title>MyStash</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <img class="brand-logo" src="./assets/icon-192.png" alt="" aria-hidden="true" />
                <div class="brand-copy">
                    <h1 id="headerTitle">MyStash</h1>
                </div>
            </div>
            <button id="backBtn" class="back-button hidden" type="button">
                <span class="back-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </span>
                <span>Alle Features</span>
            </button>
        </header>

        <main id="lobbyView" class="lobby-view">
            <section class="features-section" aria-labelledby="featuresTitle">
                <div class="section-heading">
                    <h2 id="featuresTitle">Features</h2>
                    <span class="feature-count"><span class="count-dot"></span> 1 verfügbar</span>
                </div>

                <div class="feature-grid">
                    <button class="feature-card" id="openTttBtn" type="button">
                        <span class="feature-icon feature-icon-game" aria-hidden="true">
                            <svg viewBox="0 0 48 48" fill="none">
                                <path d="M16 4V44M32 4V44M4 16H44M4 32H44" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <path d="M7 7L13 13M13 7L7 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                                <circle cx="40" cy="40" r="3.5" stroke="currentColor" stroke-width="2.5" />
                            </svg>
                        </span>
                        <span class="feature-content">
                            <span class="feature-category">SPIEL · 2 SPIELER</span>
                            <span class="feature-title">Tic-Tac-Toe</span>
                            <span class="feature-description">Der Klassiker für zwischendurch. Direkt gemeinsam auf einem Gerät spielen.</span>
                        </span>
                        <span class="feature-arrow" aria-hidden="true">→</span>
                    </button>

                    <div class="feature-card feature-card-disabled" aria-disabled="true">
                        <span class="feature-icon feature-icon-soon" aria-hidden="true">
                            <svg viewBox="0 0 48 48" fill="none">
                                <path d="M24 7V41M7 24H41" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                                <circle cx="24" cy="24" r="17" stroke="currentColor" stroke-width="2" stroke-dasharray="3 5" />
                            </svg>
                        </span>
                        <span class="feature-content">
                            <span class="feature-category">DEINE NÄCHSTE IDEE</span>
                            <span class="feature-title">Weitere Features</span>
                            <span class="feature-description">Der Platz für neue Werkzeuge, Ideen und praktische Helfer.</span>
                            <span class="feature-coming">IN VORBEREITUNG</span>
                        </span>
                    </div>
                </div>
            </section>
        </main>

        <section id="tttView" class="game-view hidden" aria-labelledby="gameLabel">
            <div class="game-intro">
                <p class="eyebrow" id="gameLabel">FEATURE 01 <span class="intro-separator">/</span> TIC TAC TOE</p>
                <span class="local-pill"><span></span> LOKAL · 2P</span>
            </div>

            <div class="scoreboard" aria-label="Spielstand">
                <div id="boxX" class="score-box active-x">
                    <div class="score-label"><span class="player-symbol player-x">×</span> Spieler X</div>
                    <div id="scoreX" class="score-val">0</div>
                </div>
                <div class="score-box score-box-draw">
                    <div class="score-label">Unentschieden</div>
                    <div id="scoreDraw" class="score-val">0</div>
                </div>
                <div id="boxO" class="score-box">
                    <div class="score-label"><span class="player-symbol player-o">○</span> Spieler O</div>
                    <div id="scoreO" class="score-val">0</div>
                </div>
            </div>

            <div class="game-board-panel">
                <div id="statusBar" class="status-bar" aria-live="polite">
                    <span class="status-indicator"></span>
                    Spieler X ist am Zug
                </div>
                <div id="board" class="board" aria-label="Tic-Tac-Toe Spielfeld"></div>
                <div class="board-caption">WÄHLE EIN FREIES FELD</div>
            </div>

            <div class="actions">
                <button id="newRoundBtn" class="btn btn-primary" type="button">
                    <span aria-hidden="true">↻</span> Neue Runde
                </button>
                <button id="resetScoreBtn" class="btn btn-secondary" type="button">
                    <span aria-hidden="true">⟲</span> Punkte zurücksetzen
                </button>
            </div>
        </section>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
